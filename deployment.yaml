apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-dashboard
  labels:
    app: transport-dashboard
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 90
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never remove a healthy pod until a new one is Ready
      maxSurge: 1
  selector:
    matchLabels:
      app: transport-dashboard
  template:
    metadata:
      labels:
        app: transport-dashboard
    spec:
      # Only needed if your Docker Hub repo is PRIVATE. Create the secret first:
      #   kubectl create secret docker-registry dockerhub-secret `
      #     --docker-username=niharikarao15 --docker-password=<token>
      # then uncomment:
      # imagePullSecrets:
      #   - name: dockerhub-secret
      containers:
        - name: transport-dashboard
          # Placeholder for the first create; Jenkins runs `kubectl set image`
          # with the real build tag (niharikarao15/transport-dashboard:<BUILD_NUMBER>).
          image: niharikarao15/transport-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: transport-dashboard-service
spec:
  type: NodePort
  selector:
    app: transport-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
