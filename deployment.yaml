
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transport-dashboard
  labels:
    app: transport-dashboard
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: transport-dashboard
  template:
    metadata:
      labels:
        app: transport-dashboard
    spec:
      containers:
        - name: transport-dashboard
          image: nginx:alpine
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: transport-dashboard-service
spec:
  type: NodePort
  selector:
    app: transport-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
